<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LiveScreenLog • 비밀번호 변경</title>
  <style>
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      font-family: 'IBM Plex Sans', system-ui, sans-serif;
      background: #12100e;
      color: #f2ebe1;
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .header {
      background: #1a1714;
      border-bottom: 1px solid #3d352c;
      padding: 0.9rem 1.5rem;
      display: flex;
      align-items: center;
      gap: 0.75rem;
      font-size: 0.95rem;
    }
    .badge {
      background: #5c9e72;
      color: white;
      font-size: 0.65rem;
      font-weight: 700;
      padding: 0.15rem 0.5rem;
      border-radius: 2px;
      letter-spacing: 0.05em;
    }
    .header a { margin-left: auto; color: #a89a88; text-decoration: none; font-size: 0.8rem; }
    .header a:hover { color: #f2ebe1; }
    .login-wrap {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
    }
    .card {
      background: #1a1714;
      border: 1px solid #3d352c;
      border-radius: 4px;
      padding: 1.75rem 1.5rem;
      width: 100%;
      max-width: 340px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.45);
      text-align: left;
    }
    .card h1 { margin: 0 0 1rem; font-size: 1.15rem; font-weight: 700; }
    .form-group {
      display: flex;
      flex-direction: column;
      align-items: stretch;
      gap: 0.25rem;
      margin-bottom: 0.95rem;
      width: 100%;
    }
    label { font-size: 0.78rem; font-weight: 600; color: #a89a88; text-align: left; width: 100%; }
    input {
      background: #12100e;
      border: 1px solid #3d352c;
      color: #f2ebe1;
      padding: 0.55rem 0.75rem;
      border-radius: 4px;
      font-size: 0.9rem;
      outline: none;
      width: 100%;
      display: block;
    }
    input:focus { border-color: #c45c26; }
    .btn {
      padding: 0.65rem 1.2rem;
      border-radius: 4px;
      font-weight: 700;
      font-size: 0.88rem;
      cursor: pointer;
      border: none;
      width: 100%;
      margin-top: 0.2rem;
      background: #c45c26;
      color: white;
    }
    .btn:hover { background: #a34a1c; }
    .msg { font-size: 0.8rem; padding: 0.5rem 0.65rem; border-radius: 4px; margin-bottom: 1rem; display: none; text-align: center; }
    .msg.error { display: block; background: rgba(212, 106, 92, 0.1); border: 1px solid #d46a5c; color: #d46a5c; }
    .msg.success { display: block; background: rgba(92, 158, 114, 0.1); border: 1px solid #5c9e72; color: #5c9e72; }
    .footer-note { margin-top: 0.9rem; font-size: 0.65rem; color: #a89a88; text-align: center; }
    .footer-note a { color: #c45c26; text-decoration: none; }
  </style>
</head>
<body>
  <div class="header">
    <strong>LiveScreenLog</strong>
    <span class="badge">ADMIN</span>
    <a href="/">대시보드</a>
  </div>
  <div class="login-wrap">
    <div class="card">
      <h1>비밀번호 변경</h1>
      <div id="msg" class="msg"></div>
      <form id="pw-form">
        <div class="form-group">
          <label for="currentPassword">현재 비밀번호</label>
          <input id="currentPassword" type="password" required autocomplete="current-password">
        </div>
        <div class="form-group">
          <label for="newPassword">새 비밀번호</label>
          <input id="newPassword" type="password" required minlength="8" autocomplete="new-password">
        </div>
        <div class="form-group">
          <label for="confirmPassword">새 비밀번호 확인</label>
          <input id="confirmPassword" type="password" required minlength="8" autocomplete="new-password">
        </div>
        <button type="submit" class="btn">변경</button>
      </form>
      <div class="footer-note"><a href="/">대시보드</a></div>
    </div>
  </div>
  <script>
    (function () {
      function showMessage(type, text) {
        var el = document.getElementById('msg');
        el.className = 'msg ' + type;
        el.textContent = text;
      }
      document.getElementById('pw-form').addEventListener('submit', function (e) {
        e.preventDefault();
        var currentPassword = document.getElementById('currentPassword').value;
        var newPassword = document.getElementById('newPassword').value;
        var confirmPassword = document.getElementById('confirmPassword').value;
        if (newPassword !== confirmPassword) {
          showMessage('error', '새 비밀번호가 일치하지 않습니다.');
          return;
        }
        var csrf = (document.cookie.match(/(?:^|; )XSRF-TOKEN=([^;]*)/) || [])[1];
        var headers = { 'Content-Type': 'application/json' };
        if (csrf) headers['X-XSRF-TOKEN'] = decodeURIComponent(csrf);
        fetch('/api/me/password', {
          method: 'POST',
          headers: headers,
          credentials: 'same-origin',
          body: JSON.stringify({ currentPassword: currentPassword, newPassword: newPassword })
        }).then(function (res) {
          if (res.status === 401) {
            window.location.href = '/login';
            return null;
          }
          return res.json().then(function (body) {
            return { ok: res.ok, status: res.status, body: body };
          });
        }).then(function (result) {
          if (!result) return;
          if (result.ok) {
            showMessage('success', '비밀번호가 변경되었습니다.');
            setTimeout(function () { window.location.href = '/'; }, 800);
          } else if (result.status === 403) {
            showMessage('error', '세션이 만료되었습니다. 새로고침 후 다시 시도하세요.');
          } else {
            showMessage('error', (result.body && result.body.error) ? result.body.error : '변경에 실패했습니다.');
          }
        }).catch(function () {
          showMessage('error', '변경에 실패했습니다.');
        });
      });
    })();
  </script>
</body>
</html>
