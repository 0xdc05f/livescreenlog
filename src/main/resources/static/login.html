<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LiveScreenLog • 로그인</title>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      font-family: 'IBM Plex Sans', system-ui, sans-serif;
      background: #12100e;
      color: #f2ebe1;
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .header {
      background: #1a1714;
      border-bottom: 1px solid #3d352c;
      padding: 0.9rem 1.5rem;
      display: flex;
      align-items: center;
      gap: 0.75rem;
      font-size: 0.95rem;
    }
    .badge {
      background: #5c9e72;
      color: white;
      font-size: 0.65rem;
      font-weight: 700;
      padding: 0.15rem 0.5rem;
      border-radius: 2px;
      letter-spacing: 0.05em;
    }
    .login-wrap {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
    }
    .card {
      background: #1a1714;
      border: 1px solid #3d352c;
      border-radius: 4px;
      padding: 1.75rem 1.5rem;
      width: 100%;
      max-width: 340px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.45);
      text-align: left;
    }
    .card h1 {
      margin: 0 0 0.1rem;
      font-size: 1.15rem;
      font-weight: 700;
      text-align: left;
    }
    .sub {
      text-align: left;
      color: #a89a88;
      font-size: 0.78rem;
      margin-bottom: 1.1rem;
    }
    .form-group {
      display: flex;
      flex-direction: column;
      align-items: stretch;
      gap: 0.25rem;
      margin-bottom: 0.95rem;
      width: 100%;
    }
    label {
      font-size: 0.78rem;
      font-weight: 600;
      color: #a89a88;
      text-align: left;
      width: 100%;
    }
    input {
      background: #12100e;
      border: 1px solid #3d352c;
      color: #f2ebe1;
      padding: 0.55rem 0.75rem;
      border-radius: 4px;
      font-size: 0.9rem;
      outline: none;
      transition: border-color 0.15s;
      width: 100%;
      display: block;
    }
    input:focus { border-color: #c45c26; }
    .btn {
      padding: 0.65rem 1.2rem;
      border-radius: 4px;
      font-weight: 700;
      font-size: 0.88rem;
      cursor: pointer;
      border: none;
      transition: all 0.15s;
      width: 100%;
      margin-top: 0.2rem;
    }
    .btn-primary { background: #c45c26; color: white; }
    .btn-primary:hover { background: #a34a1c; }
    .msg {
      font-size: 0.8rem;
      padding: 0.5rem 0.65rem;
      border-radius: 4px;
      margin-bottom: 1rem;
      display: none;
      text-align: center;
    }
    .msg.error {
      display: block;
      background: rgba(212, 106, 92, 0.1);
      border: 1px solid #d46a5c;
      color: #d46a5c;
    }
    .msg.success {
      display: block;
      background: rgba(92, 158, 114, 0.1);
      border: 1px solid #5c9e72;
      color: #5c9e72;
    }
    .footer-note {
      margin-top: 0.9rem;
      font-size: 0.65rem;
      color: #a89a88;
      text-align: center;
      line-height: 1.3;
    }
  </style>
</head>
<body>
  <div class="header">
    <strong>LiveScreenLog</strong>
    <span class="badge">ADMIN</span>
  </div>
  <div class="login-wrap">
    <div class="card">
      <h1>로그인</h1>
      <div class="sub">대시보드에 접속합니다</div>
      <div id="msg" class="msg"></div>
      <form action="/login" method="post" autocomplete="on">
        <div class="form-group">
          <label for="username">아이디</label>
          <input id="username" name="username" type="text" required autofocus autocomplete="username">
        </div>
        <div class="form-group">
          <label for="password">비밀번호</label>
          <input id="password" name="password" type="password" required autocomplete="current-password">
        </div>
        <button type="submit" class="btn btn-primary">로그인</button>
      </form>
      <div class="footer-note">최초 계정은 서버 시작 시 생성됩니다.</div>
    </div>
  </div>
  <script>
    (function () {
      function showMessage(type, text) {
        var el = document.getElementById('msg');
        el.className = 'msg ' + type;
        el.textContent = text;
      }

      fetch('/api/me', { credentials: 'same-origin' }).then(function (res) {
        if (res.ok) {
          location.replace('/');
        }
      }).catch(function () {});

      var params = new URLSearchParams(window.location.search);
      if (params.has('error')) {
        showMessage('error', '아이디 또는 비밀번호가 올바르지 않습니다.');
      } else if (params.has('logout')) {
        showMessage('success', '로그아웃되었습니다.');
      }
      if ((params.has('error') || params.has('logout')) && window.history && window.history.replaceState) {
        window.history.replaceState({}, document.title, window.location.pathname);
      }

      var form = document.querySelector('form');
      var btn = form && form.querySelector('button[type="submit"]');
      if (form) {
        form.addEventListener('submit', function (e) {
          e.preventDefault();
          if (btn) btn.disabled = true;
          var body = new URLSearchParams();
          body.set('username', document.getElementById('username').value);
          body.set('password', document.getElementById('password').value);
          fetch('/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
            credentials: 'same-origin',
            redirect: 'follow',
            body: body.toString()
          }).then(function (res) {
            var url = res.url || '';
            if (res.ok && url.indexOf('/login') === -1) {
              location.replace('/');
              return;
            }
            showMessage('error', '아이디 또는 비밀번호가 올바르지 않습니다.');
            if (btn) btn.disabled = false;
          }).catch(function () {
            showMessage('error', '아이디 또는 비밀번호가 올바르지 않습니다.');
            if (btn) btn.disabled = false;
          });
        });
      }

      setTimeout(function () {
        var u = document.getElementById('username');
        if (u && !u.value) u.focus();
      }, 50);
    })();
  </script>
</body>
</html>
