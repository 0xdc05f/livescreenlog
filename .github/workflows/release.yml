# Tag format: v0.3.0 (must match version.json)
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

jobs:
  build:
    name: Build artifacts
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      tag: ${{ steps.ver.outputs.tag }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          registry-url: https://registry.npmjs.org
          cache-dependency-path: |
            frontend/package-lock.json
            sdk/package-lock.json

      - id: ver
        run: |
          VERSION=$(node -p "require('./version.json').version")
          TAG="${GITHUB_REF_NAME}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          if [ "v${VERSION}" != "${TAG}" ]; then
            echo "::error::Tag ${TAG} must equal v${VERSION} from version.json"
            exit 1
          fi

      - run: ./release.sh --sync-only

      - run: ./gradlew test bootJar --no-daemon

      - name: Build browser SDK
        working-directory: sdk
        run: npm ci && npm run build

      - name: Stage release assets
        run: |
          set -euo pipefail
          VERSION="${{ steps.ver.outputs.version }}"
          mkdir -p dist/release
          JAR="build/libs/livescreenlog-${VERSION}.jar"
          cp "$JAR" "dist/release/livescreenlog-${VERSION}.jar"
          cp sdk/dist/livescreenlog.js "dist/release/livescreenlog-${VERSION}.js"
          cp "dist/release/livescreenlog-${VERSION}.jar" dist/release/livescreenlog.jar
          cp "dist/release/livescreenlog-${VERSION}.js" dist/release/livescreenlog.js
          (
            cd dist/release
            sha256sum livescreenlog-${VERSION}.jar livescreenlog-${VERSION}.js \
              livescreenlog.jar livescreenlog.js > SHA256SUMS.txt
          )

      - uses: actions/upload-artifact@v7
        with:
          name: release-assets
          path: dist/release/

      - uses: actions/upload-artifact@v7
        with:
          name: server-jar
          path: build/libs/livescreenlog-${{ steps.ver.outputs.version }}.jar

  github-release:
    name: GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: dist/release
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build.outputs.tag }}
          name: LiveScreenLog ${{ needs.build.outputs.version }}
          generate_release_notes: true
          body: |
            ## Downloads · 다운로드

            | Artifact | Description |
            |----------|-------------|
            | `livescreenlog.jar` | Server (dashboard + embedded SDK) |
            | `livescreenlog.js` | Browser UMD bundle |
            | `SHA256SUMS.txt` | Checksums |

            **Latest:** https://github.com/0xdc05f/livescreenlog/releases/latest/download/livescreenlog.jar

            Requires JRE 25, PostgreSQL, Valkey/Redis — see Manual.md
          files: |
            dist/release/livescreenlog.jar
            dist/release/livescreenlog.js
            dist/release/livescreenlog-${{ needs.build.outputs.version }}.jar
            dist/release/livescreenlog-${{ needs.build.outputs.version }}.js
            dist/release/SHA256SUMS.txt

  ghcr:
    name: GHCR
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          name: server-jar
          path: build/libs
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          push: true
          tags: |
            ghcr.io/0xdc05f/livescreenlog:${{ needs.build.outputs.version }}
            ghcr.io/0xdc05f/livescreenlog:latest
            ghcr.io/0xdc05f/livescreenlog:server-${{ needs.build.outputs.version }}

  npm:
    name: npm
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: sdk/package-lock.json
      - name: Publish
        working-directory: sdk
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "${NODE_AUTH_TOKEN}" ]; then
            echo "::error::NPM_TOKEN secret is not set"
            exit 1
          fi
          npm ci
          npm publish --access public
